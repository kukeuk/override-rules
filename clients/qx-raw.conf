# 由 scripts/generate-clients.mjs 生成，请勿手改；改上游后重新跑脚本
# 对应 mihomo 分流（convert.min.js）的 Quantumult X 版（raw 直链版，实时最新）
# 使用：1) 导入本文件到圈X；2) 在下面的 [server_remote] 填你的节点订阅链接；
# 3) 地区组（美国节点/新加坡节点…）会自动按正则筛选订阅里的节点，无需手动填；
# 4) 其它策略已自动跟随「选择代理」

[general]
# 节点延迟测试地址（url-latency-benchmark 策略用它测速）
server_check_url=http://www.gstatic.com/generate_204

[server_remote]
# ↓↓↓ 把你的节点订阅链接填在这里（去掉行首的 #） ↓↓↓
# https://你的机场订阅链接, tag=节点订阅, enabled=true

[policy]
# 地区策略：按正则自动筛选订阅节点（与 mihomo 版同一套正则）
url-latency-benchmark=香港节点, server-tag-regex=香港|港|\b(?:HK|hk)(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌|🇭🇰, check-interval=300, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
